apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: customer1-db
  labels:
    managed-by: flux
spec:
  instances: 3

  # Recovery bootstrap: replays WAL from the objectstore back to the latest
  # consistent point. Switch back to initdb once the cluster is healthy.
  # For PITR, add recoveryTarget.targetTime under the recovery block.
  bootstrap:
    recovery:
      source: customer1-source

  externalClusters:
    - name: customer1-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: customer1-objectstore

  storage:
    size: 1Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: customer1-objectstore
